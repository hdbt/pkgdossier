# The site for pkgdossier, built by .github/workflows/pkgdown.yaml and published to
# GitHub Pages. Add the url to URL in DESCRIPTION once the site is live there (CRAN
# checks every URL in DESCRIPTION).
url: https://hdbt.github.io/pkgdossier/

template:
  bootstrap: 5
  # Colours from the hex logo: the document blue for links and accents, the outline
  # navy for the navbar and the text. No dark mode: the figures have white
  # backgrounds. pkgdown/extra.css holds the rest of the styling.
  bslib:
    primary: "#2c5ea8"
    dark: "#17202c"
    body-color: "#17202c"
    headings-color: "#17202c"
    border-radius: 0.6rem
    code-bg: "#F3F6F9"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}
  # pkgdown takes the site logo from man/figures/logo.svg; link previews need a PNG.
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "pkgdossier logo"

home:
  title: "pkgdossier: compare what users meet before and after a package upgrade"

# Reference example figures as SVG on white. pkgdown 2.2 draws them with bg = NA,
# which svglite rejects ("Expected string vector of length 1"); grDevices::svg takes
# it. A vignette can still set svglite in its own chunk options.
figures:
  dev: grDevices::svg
  fig.ext: svg
  bg: white

reference:
- title: Describe a dossier
  desc: >
    Where the two versions come from and which code to run. Nothing is fetched or
    run until the stages below.
  contents:
  - dossier
  - sources
  - deps
  - from_vignettes
  - step
  - default_skip_classes
  - example_dossier
- title: Run it
  desc: >
    Each stage caches its work in the work folder; run_dossier() calls them all.
  contents:
  - run_dossier
  - prepare_versions
  - run_scenarios
  - compare_runs
- title: Read and share the results
  contents:
  - differences
  - summary.pkgdossier_comparison
  - write_dossier_html
  - write_dossier_json
  - write_dossier_md
- title: Pull requests and continuous integration
  contents:
  - accept_differences
  - check_differences

# Articles in vignettes/articles/ are built only for this site: .Rbuildignore keeps
# them out of the package, so CRAN neither ships nor runs them.
articles:
- title: Guides
  navbar: ~
  contents:
  - pkgdossier
  - articles/before-a-release
  - articles/on-pull-requests
  - articles/writing-scenarios
  - articles/baselines-and-dependencies

navbar:
  bg: dark
  type: dark
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
